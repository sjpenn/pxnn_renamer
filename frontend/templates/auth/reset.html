{% extends "base.html" %}

{% block title %}Reset password — PxNN{% endblock %}
{% block body_class %}bg-stage{% endblock %}

{% block body %}
{% include "partials/nav.html" %}

<main id="main-content" class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 bg-stage">
    <div class="w-full max-w-md">
        <div class="card p-8">
            <p class="text-[11px] font-mono font-medium uppercase tracking-widest text-cyan">&gt; NEW PASSWORD</p>
            <h1 class="mt-2 font-editorial text-3xl text-ink">Choose a new password</h1>

            <div id="reset-error" class="hidden mt-4 rounded-xl bg-danger/10 border border-danger/30 p-3 text-sm text-danger"></div>

            <form id="reset-form" class="mt-6 space-y-4">
                <input type="hidden" name="token" value="{{ token }}">
                <label class="block">
                    <span class="field-label">New password</span>
                    <input type="password" name="new_password" required autocomplete="new-password" minlength="8" class="input">
                </label>
                <label class="block">
                    <span class="field-label">Confirm new password</span>
                    <input type="password" name="confirm_password" required autocomplete="new-password" minlength="8" class="input">
                </label>
                <button type="submit" class="btn btn-primary w-full py-3">Reset password</button>
            </form>

            <p class="mt-6 text-center text-sm text-ink-dim">
                <a href="/login" class="font-semibold text-cyan hover:text-white transition">Back to sign in →</a>
            </p>
        </div>
    </div>
</main>

<script>
(function() {
    const form = document.getElementById('reset-form');
    const errorEl = document.getElementById('reset-error');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorEl.classList.add('hidden');
        const response = await fetch('/api/auth/reset', { method: 'POST', body: new FormData(form) });
        if (response.ok) {
            window.location.href = '/login';
        } else {
            const data = await response.json().catch(() => ({ detail: 'Reset failed.' }));
            errorEl.textContent = data.detail || 'Reset failed.';
            errorEl.classList.remove('hidden');
        }
    });
})();
</script>
{% endblock %}
