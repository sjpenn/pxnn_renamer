<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PxNN — Filename studio for beatmakers{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/css/tailwind.min.css?v=warm-2">
    <link rel="stylesheet" href="/static/css/style.css?v=warm-2">

    <style>
      :root {
        --color-stage:          #1a1918;
        --color-stage-raised:   #242322;
        --color-stage-sunken:   #131211;
        --color-rail:           #2e2d2b;
        --color-hairline:       rgba(175, 174, 172, 0.12);
        --color-ink:            #faf9f6;
        --color-ink-dim:        #afaeac;
        --color-ink-mute:       #868584;
        --color-ink-soft:       #c8c7c5;
        --color-cyan:           #c9a66b;
        --color-cyan-soft:      #a8884f;
        --color-magenta:        #868584;
        --color-amber:          #c9a66b;
        --color-success:        #7fb870;
        --color-danger:         #d4564e;
        --color-hairline-raised:#4a4948;
        --color-danger-hover:   #e06b63;
        --color-danger-light:   #e88a84;
      }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full font-sans text-ink antialiased relative {% block body_class %}bg-stage{% endblock %}">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:rounded-lg focus:bg-cyan focus:px-4 focus:py-2 focus:text-stage focus:font-semibold">Skip to main content</a>
    {% block body %}{% endblock %}
</body>
</html>
